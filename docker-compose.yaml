
services:
  # 1. MongoDB Container
  mongo_db:
    image: mongo:latest
    container_name: local_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: site242557       # Matches your index.js
      MONGO_INITDB_ROOT_PASSWORD: UgeeJie6         # Matches your index.js
      MONGO_INITDB_DATABASE: mongo_site242557      # Matches your index.js
    ports:
      - "27017:27017" # Exposes DB to your local machine (for mongosh/Compass)
    volumes:
      - mongo_data:/data/db

  # 2. Node.js Container (Node 22)
  node_app:
    image: node:22
    container_name: local_node_app
    working_dir: /app/backend-node
    volumes:
      - ./:/app              # Maps your current folder to /app in container
      - /app/backend-node/node_modules    # Prevents local node_modules from overwriting container's
    ports:
      - "8000:8000"          # Maps port 8000 (from index.js) to localhost
    depends_on:
      - mongo_db
    environment:
      # Passiamo TUTTE le variabili necessarie al DB
      DB_HOST: mongo_db 
      DB_USER: site242557
      DB_PASS: UgeeJie6
      DB_NAME: mongo_site242557
      PORT: 8000
      JWT_SECRET: super-segreto-temporaneo
      JWT_EXPIRES_IN: 1d    
    command: sh -c "npm install && npm start"

  # 3. PostgreSQL for the .NET backend
  postgres_db:
    image: postgres:17
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: artaround
      POSTGRES_PASSWORD: artaround
      POSTGRES_DB: artaround
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artaround"]
      interval: 2s
      retries: 15

  # 4. One-shot: apply EF migrations, then load museums and demo data. Never done by
  #    the API at startup, so a failed migration cannot leave a half-started server.
  dotnet_setup:
    build:
      context: .
      dockerfile: backend-dotnet/Dockerfile
    image: artaround-dotnet
    depends_on:
      postgres_db:
        condition: service_healthy
    environment: &dotnet_env
      ConnectionStrings__Default: Host=postgres_db;Database=artaround;Username=artaround;Password=artaround
      Jwt__Key: super-segreto-temporaneo-di-almeno-32-caratteri
    entrypoint: ["sh", "-c", "dotnet ArtAround.Api.dll migrate && dotnet ArtAround.Api.dll seed"]

  # 5. The .NET API (serves both frontends too), on 8001 so it can run beside Node.
  dotnet_app:
    image: artaround-dotnet
    container_name: local_dotnet_app
    depends_on:
      dotnet_setup:
        condition: service_completed_successfully
    environment: *dotnet_env
    ports:
      - "8001:8080"

volumes:
  mongo_data:
  postgres_data: